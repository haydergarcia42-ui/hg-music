<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HG.MUSIC</title>

<style>

/* ================================
   CONFIGURACIÓN GENERAL
================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: white;

    background:
        linear-gradient(
            135deg,
            #050505,
            #111111,
            #050505
        );

}


/* ================================
   PANTALLA DE INICIO
================================ */

#inicio {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(
            circle,
            #151515,
            #050505 70%
        );

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 9999;

    transition:
        opacity 1s ease,
        visibility 1s ease;

}


/* ================================
   LOGO HG.MUSIC
================================ */

.logo-text {

    font-size: 58px;

    font-weight: 900;

    letter-spacing: 5px;

    background:

        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff,
            #1ed760
        );

    background-size: 300%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        logoEntrada 1.2s ease,
        logoColores 4s linear infinite;

    filter:

        drop-shadow(
            0 0 10px
            rgba(30,215,96,0.6)
        )

        drop-shadow(
            0 0 25px
            rgba(0,255,255,0.3)
        );

}


/* ENTRADA DEL LOGO */

@keyframes logoEntrada {

    from {

        opacity: 0;

        transform:
            scale(0.5);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* COLORES DEL LOGO */

@keyframes logoColores {

    0% {

        background-position: 0%;

    }

    50% {

        background-position: 100%;

    }

    100% {

        background-position: 0%;

    }

}


/* ================================
   ARO DE CARGA
================================ */

.cargando {

    width: 55px;

    height: 55px;

    margin-top: 35px;

    border-radius: 50%;

    border:

        5px solid
        rgba(255,255,255,0.15);

    border-top:

        5px solid #1ed760;

    border-right:

        5px solid #00ffff;

    animation:

        cargar 1s linear infinite;

}


/* GIRO */

@keyframes cargar {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


/* ================================
   TEXTO DE CARGA
================================ */

.texto-inicio {

    margin-top: 20px;

    font-size: 13px;

    letter-spacing: 4px;

    color: #999;

}


/* ================================
   OCULTAR PANTALLA
================================ */

#inicio.oculto {

    opacity: 0;

    visibility: hidden;

}


/* ================================
   LUCES DEL FONDO
================================ */

body::before {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    background: #1ed760;

    filter: blur(180px);

    opacity: 0.10;

    top: -180px;

    left: -150px;

    z-index: -1;

}


body::after {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    background: #7b2cff;

    filter: blur(180px);

    opacity: 0.10;

    bottom: -180px;

    right: -150px;

    z-index: -1;

}


/* ================================
   TÍTULO
================================ */

header {

    text-align: center;

    padding: 25px;

}


header h1 {

    margin: 0;

    font-size: 38px;

    background:

        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff
        );

    background-size: 300%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:

        colores 4s linear infinite;

}


@keyframes colores {

    0% {

        background-position: 0%;

    }

    50% {

        background-position: 100%;

    }

    100% {

        background-position: 0%;

    }

}


/* ================================
   REPRODUCTOR
================================ */

.musica {

    width: 90%;

    max-width: 430px;

    margin: 20px auto;

    padding: 25px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 25px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.5);

    text-align: center;

}


/* ================================
   PORTADA
================================ */

.portada {

    width: 260px;

    height: 260px;

    margin: auto;

    border-radius: 20px;

    background:

        linear-gradient(
            135deg,
            #1ed760,
            #7b2cff,
            #ff0080
        );

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 80px;

    box-shadow:

        0 10px 40px
        rgba(30,215,96,0.25);

}


.portada.reproduciendo {

    animation:
        girarPortada 8s linear infinite;

}


@keyframes girarPortada {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


/* ================================
   NOMBRE
================================ */

.titulo {

    margin-top: 25px;

    font-size: 27px;

    font-weight: bold;

}


.artista {

    color: #aaa;

    margin-top: 8px;

    font-size: 14px;

}


/* ================================
   BARRA
================================ */

.barra {

    width: 100%;

    height: 8px;

    margin-top: 25px;

    background: #333;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

}


.progreso {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:

        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff
        );

    background-size: 300%;

    animation:
        movimiento 3s linear infinite;

}


@keyframes movimiento {

    0% {

        background-position: 0%;

    }

    100% {

        background-position: 300%;

    }

}


/* ================================
   TIEMPO
================================ */

.tiempo {

    display: flex;

    justify-content:
        space-between;

    margin-top: 7px;

    color: #999;

    font-size: 12px;

}


/* ================================
   CONTROLES
================================ */

.controles {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;

    margin-top: 25px;

}


.boton {

    width: 55px;

    height: 55px;

    border: none;

    border-radius: 50%;

    background: #292929;

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition: 0.3s;

}


.boton:hover {

    transform:
        scale(1.1);

    background: #333;

}


/* ================================
   PLAY
================================ */

.play {

    width: 75px;

    height: 75px;

    border: none;

    border-radius: 50%;

    color: black;

    font-size: 30px;

    cursor: pointer;

    background:

        linear-gradient(
            135deg,
            #1ed760,
            #00ffff,
            #8a2be2
        );

    box-shadow:

        0 0 25px
        rgba(30,215,96,0.5);

    transition: 0.3s;

}


.play:hover {

    transform:
        scale(1.12);

    box-shadow:

        0 0 40px
        rgba(0,255,255,0.7);

}


/* ================================
   LISTA DE CANCIONES
================================ */

.lista {

    width: 90%;

    max-width: 500px;

    margin:
        30px auto 60px;

}


.lista h2 {

    margin-bottom: 15px;

}


.cancion {

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 12px;

    margin-bottom: 10px;

    background:
        rgba(255,255,255,0.06);

    border-radius: 15px;

    cursor: pointer;

    transition: 0.3s;

}


.cancion:hover {

    background:
        rgba(30,215,96,0.15);

    transform:
        translateX(5px);

}


/* MINI PORTADAS */

.mini-portada {

    width: 55px;

    height: 55px;

    border-radius: 10px;

    background:

        linear-gradient(
            135deg,
            #1ed760,
            #7b2cff
        );

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 25px;

    flex-shrink: 0;

}


.info {

    flex: 1;

    text-align: left;

}


.nombre {

    font-weight: bold;

}


.artista-lista {

    color: #999;

    font-size: 13px;

    margin-top: 5px;

}


.play-lista {

    font-size: 20px;

}


/* ================================
   CELULAR
================================ */

@media (max-width: 500px) {

    .logo-text {

        font-size: 42px;

        letter-spacing: 3px;

    }


    .cargando {

        width: 50px;

        height: 50px;

    }


    header h1 {

        font-size: 30px;

    }


    .portada {

        width: 230px;

        height: 230px;

    }


    .musica {

        padding: 20px;

    }

}

</style>

</head>


<body>


<!-- =================================
     PANTALLA DE INICIO
================================= -->

<div id="inicio">


    <div class="logo-text">

        HG.MUSIC

    </div>


    <div class="cargando"></div>


    <div class="texto-inicio">

        CARGANDO MÚSICA...

    </div>


</div>



<!-- =================================
     MENÚ PRINCIPAL
================================= -->

<header>

    <h1>

        🎵 HG.MUSIC

    </h1>

</header>



<!-- =================================
     REPRODUCTOR
================================= -->

<div class="musica">


    <div
        class="portada"
        id="portada">

        🎧

    </div>


    <div
        class="titulo"
        id="titulo">

        ALÓ

    </div>


    <div
        class="artista"
        id="artista">

        BLESSD ❌ FRONTI ❌ TUTU ❌ JUNH ❌ TURY

    </div>


    <audio id="audio">

        <source
            id="archivo"
            src="cancion.mp3"
            type="audio/mpeg">

    </audio>


    <!-- BARRA -->

    <div
        class="barra"
        id="barra">

        <div
            class="progreso"
            id="progreso">

        </div>

    </div>


    <!-- TIEMPO -->

    <div class="tiempo">

        <span id="actual">

            0:00

        </span>


        <span id="duracion">

            0:00

        </span>

    </div>


    <!-- CONTROLES -->

    <div class="controles">


        <button
            class="boton"
            onclick="anterior()">

            ⏮

        </button>


        <button
            class="play"
            id="play"
            onclick="reproducir()">

            ▶

        </button>


        <button
            class="boton"
            onclick="siguiente()">

            ⏭

        </button>


    </div>


</div>



<!-- =================================
     LISTA
================================= -->

<div class="lista">


    <h2>

        🎶 Tus canciones

    </h2>


    <!-- CANCIÓN 1 -->

    <div
        class="cancion"
        onclick="cambiarCancion(0)">


        <div class="mini-portada">

            🎧

        </div>


        <div class="info">

            <div class="nombre">

                ALÓ

            </div>


            <div class="artista-lista">

                BLESSD ❌ FRONTI ❌ TUTU ❌ JUNH ❌ TURY

            </div>

        </div>


        <div class="play-lista">

            ▶

        </div>


    </div>



    <!-- CANCIÓN 2 -->

    <div
        class="cancion"
        onclick="cambiarCancion(1)">


        <div class="mini-portada">

            🎵

        </div>


        <div class="info">

            <div class="nombre">

                yugorcito

            </div>


            <div class="artista-lista">

                Mi artista

            </div>

        </div>


        <div class="play-lista">

            ▶

        </div>


    </div>



    <!-- CANCIÓN 3 -->

    <div
        class="cancion"
        onclick="cambiarCancion(2)">


        <div class="mini-portada">

            🔥

        </div>


        <div class="info">

            <div class="nombre">

                super Star

            </div>


            <div class="artista-lista">

                Mi artista

            </div>

        </div>


        <div class="play-lista">

            ▶

        </div>


    </div>


</div>



<script>

/* =================================
   PANTALLA DE CARGA: 4 SEGUNDOS
================================= */

setTimeout(function() {

    document
        .getElementById("inicio")
        .classList.add("oculto");

}, 4000);



/* =================================
   CANCIONES
================================= */

const canciones = [

    {

        archivo: "cancion.mp3",

        nombre: "ALÓ",

        artista:
        "BLESSD ❌ FRONTI ❌ TUTU ❌ JUNH ❌ TURY"

    },


    {

        archivo: "cancion2.mp3",

        nombre: "yugorcito",

        artista: "Mi artista"

    },


    {

        archivo: "cancion3.mp3",

        nombre: "super Star",

        artista: "Mi artista"

    }

];


let indice = 0;


/* ELEMENTOS */

const audio =
    document.getElementById("audio");

const archivo =
    document.getElementById("archivo");

const play =
    document.getElementById("play");

const progreso =
    document.getElementById("progreso");

const barra =
    document.getElementById("barra");

const actual =
    document.getElementById("actual");

const duracion =
    document.getElementById("duracion");

const titulo =
    document.getElementById("titulo");

const artista =
    document.getElementById("artista");

const portada =
    document.getElementById("portada");


/* =================================
   PLAY / PAUSA
================================= */

function reproducir() {

    if (audio.paused) {

        audio.play();

        play.innerHTML = "⏸";

        portada.classList.add(
            "reproduciendo"
        );

    } else {

        audio.pause();

        play.innerHTML = "▶";

        portada.classList.remove(
            "reproduciendo"
        );

    }

}


/* =================================
   CAMBIAR CANCIÓN
================================= */

function cambiarCancion(numero) {

    indice = numero;

    archivo.src =
        canciones[indice].archivo;

    titulo.innerHTML =
        canciones[indice].nombre;

    artista.innerHTML =
        canciones[indice].artista;

    audio.load();

    audio.play();

    play.innerHTML = "⏸";

    portada.classList.add(
        "reproduciendo"
    );

}


/* =================================
   SIGUIENTE
================================= */

function siguiente() {

    indice++;

    if (indice >= canciones.length) {

        indice = 0;

    }

    cambiarCancion(indice);

}


/* =================================
   ANTERIOR
================================= */

function anterior() {

    indice--;

    if (indice < 0) {

        indice =
            canciones.length - 1;

    }

    cambiarCancion(indice);

}


/* =================================
   BARRA DE PROGRESO
================================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) {

            return;

        }

        const porcentaje =

            (
                audio.currentTime /
                audio.duration
            ) * 100;

        progreso.style.width =
            porcentaje + "%";

        actual.innerHTML =
            convertirTiempo(
                audio.currentTime
            );

    }
);


/* =================================
   DURACIÓN
================================= */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duracion.innerHTML =
            convertirTiempo(
                audio.duration
            );

    }
);


/* =================================
   CUANDO TERMINA
================================= */

audio.addEventListener(
    "ended",
    function() {

        siguiente();

    }
);


/* =================================
   CLIC EN LA BARRA
================================= */

barra.addEventListener(
    "click",
    function(e) {

        if (!audio.duration) {

            return;

        }

        const ancho =
            barra.clientWidth;

        const posicion =
            e.offsetX;

        const porcentaje =
            posicion / ancho;

        audio.currentTime =
            porcentaje *
            audio.duration;

    }
);


/* =================================
   CONVERTIR TIEMPO
================================= */

function convertirTiempo(segundos) {

    const minutos =
        Math.floor(
            segundos / 60
        );

    const segundosRestantes =
        Math.floor(
            segundos % 60
        );

    return (

        minutos +
        ":" +

        (
            segundosRestantes < 10

            ? "0" +
              segundosRestantes

            : segundosRestantes

        )

    );

}

</script>

</body>

</html>
